name: UCC audit log sync

# T22 — Daily pull of fitme-story Vercel Blob → FT2 .claude/logs/ucc-auth-events.jsonl.
#
# Companion to fitme-story/scripts/sync-audit-log-to-blob.ts (T21). The Blob
# URL is a public R2-style HTTPS endpoint set by the fitme-story deploy.
# We fetch it, diff against the committed file, and only commit on change.
#
# Security review: this workflow does NOT consume any user-controlled
# untrusted input (issue titles, PR descriptions, commit messages, etc.).
# All inputs are repo variables, GITHUB_TOKEN, and WORKFLOW_PR_TOKEN (PAT). No
# command-injection surface.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ucc-audit-log-sync
  cancel-in-progress: false

env:
  BLOB_URL: ${{ vars.UCC_AUDIT_BLOB_URL }}
  TARGET_PATH: .claude/logs/ucc-auth-events.jsonl

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Blob URL configured
        id: check
        run: |
          if [ -z "$BLOB_URL" ]; then
            echo "UCC_AUDIT_BLOB_URL repo variable not set; skipping sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch latest audit log
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p "$(dirname "$TARGET_PATH")"
          curl --fail --silent --show-error --max-time 60 \
            -o "$TARGET_PATH.new" \
            "$BLOB_URL"

      - name: Diff against committed
        if: steps.check.outputs.skip == 'false'
        id: diff
        run: |
          if [ ! -f "$TARGET_PATH" ]; then
            mv "$TARGET_PATH.new" "$TARGET_PATH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if cmp -s "$TARGET_PATH" "$TARGET_PATH.new"; then
            rm "$TARGET_PATH.new"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            mv "$TARGET_PATH.new" "$TARGET_PATH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # W37 fix (option B, 2026-06-15): the audit log is append-only — commit it
      # straight to main. Bot PRs (GITHUB_TOKEN) never trigger CI, so under strict
      # branch protection they deadlock ("expected" forever — #614/#676 were
      # abandoned ucc-audit syncs). Direct push needs the github-actions app in
      # main's bypass_pull_request_allowances; until configured the push is
      # rejected and we fall back to the legacy branch+PR (no regression).
      # See .claude/integrity/observed-patterns.md W37.
      #
      # 2026-10-23: the W37 fallback still deadlocked — 85 sync PRs piled up
      # (#984 → #1191) because (1) GITHUB_TOKEN PRs never trigger CI and (2) the
      # runner `git commit` is unsigned while main has required_signatures. Now
      # lands the same way as integrity-cycle.yml (Option B): a signed commit via
      # createCommitOnBranch, opened with WORKFLOW_PR_TOKEN so CI fires, squash
      # auto-merge. The file is cumulative, so older open sync PRs are closed as
      # superseded — at most one is ever open.
      - name: Land audit-log on main (signed PR + auto-merge)
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PR_TOKEN || secrets.GITHUB_TOKEN }}
          HAVE_PAT: ${{ secrets.WORKFLOW_PR_TOKEN != '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${HAVE_PAT}" != "true" ]; then
            echo "::warning title=Option B not configured::WORKFLOW_PR_TOKEN unset — the PR runs as GITHUB_TOKEN, will NOT trigger required checks, and will deadlock. Provision the PAT. See docs/setup/bot-pr-ci-trigger-setup.md."
          fi
          DATE_STAMP=$(date -u +%Y%m%d)
          BRANCH="chore/ucc-audit-log-sync-${DATE_STAMP}"
          gh pr list --repo "${REPO}" --state open --search "chore(ucc-auth): daily sync of audit log in:title" \
            --json number,headRefName -q '.[]|select(.headRefName|startswith("chore/ucc-audit-log-sync-"))|.number' \
            | while read -r OLD; do
                gh pr close "$OLD" --repo "${REPO}" --delete-branch \
                  --comment "Superseded by the ${DATE_STAMP} sync (the audit log is cumulative)." || true
              done
          git add "$TARGET_PATH"
          python3 scripts/create-signed-snapshot-pr.py \
            --repo "${REPO}" \
            --branch "${BRANCH}" \
            --base main \
            --message "chore(ucc-auth): daily sync of audit log (${DATE_STAMP})" \
            --message-body "Automated daily UCC audit-log sync. Run: ${RUN_URL}" \
            --pr-title "chore(ucc-auth): daily sync of audit log (${DATE_STAMP})" \
            --pr-body "Daily UCC audit log sync from fitme-story Vercel Blob → \`.claude/logs/ucc-auth-events.jsonl\`. Cumulative; older sync PRs are closed as superseded. Run: ${RUN_URL}. (Signed commit via createCommitOnBranch; auto-merge enabled.)" \
            --label automated
