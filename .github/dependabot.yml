# Dependabot config — keeps deps + GH Actions current.
#
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # ─────────────────────────────────────────────────────────────
  # GitHub Actions — pin to SHA, auto-PR on upgrade
  # ─────────────────────────────────────────────────────────────
  # Tier S security hardening (2026-05-21): tag-retag attack
  # vector — a compromised maintainer can retag e.g. `@v4` at a
  # malicious SHA. Dependabot opens PRs that pin to specific SHAs;
  # auto-merge them after CI passes.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    # When upgrading from @v4 to @v5, Dependabot writes the SHA in
    # the version field automatically (modern behavior). Operator
    # confirms via PR review then squash-merges.

  # ─────────────────────────────────────────────────────────────
  # npm (root + website/dashboard if those exist as separate trees)
  # ─────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    groups:
      # Group minor + patch upgrades so the PR cadence stays manageable.
      # Majors stay as individual PRs for explicit review — DO NOT auto-merge.
      # Build-tooling majors (e.g. style-dictionary) often need a COORDINATED
      # config migration in the SAME PR; the bare bump breaks `make tokens` on
      # the post-merge `push: main` run. See the #577/#596/#668 incidents +
      # docs/setup/style-dictionary-v5-migration-runbook.md. As of the
      # 2026-06-08 CI fix (ci.yml now runs `make tokens-check` on package*.json
      # changes), such a bare major bump FAILS at PR time instead of post-merge.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # ─────────────────────────────────────────────────────────────
  # Python (HADF analysis venv via ai-engine)
  # ─────────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/ai-engine"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "python"

  # ─────────────────────────────────────────────────────────────
  # /website + /dashboard (Astro sites) — security updates only
  # ─────────────────────────────────────────────────────────────
  # limit 0 = no routine version-update PRs; Dependabot *security* updates
  # still open for these dirs and DO honor the ignore list below.
  # astro 6→7 (+ @astrojs/vercel 10→11) is a known-broken upgrade here
  # (rolldown × tailwind-v4, observed pattern W29) and no CI builds these
  # sites, so a green check doesn't validate it. Dependabot re-opened it 5×
  # (#1097 #1105 #1198 #1199 #1215). The critical astro advisories stay open in
  # the Security tab until a dedicated astro-7 migration removes this ignore.
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "astro"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@astrojs/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "astro"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@astrojs/*"
        update-types: ["version-update:semver-major"]
